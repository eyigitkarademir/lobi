<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80" role="img" aria-label="Lobi lockup, direction B">
  <!-- Lockup is wordmark-led, mark left as small editorial seal. -->

  <!-- Mark, scaled 64->48, translated to (8, 16). -->
  <g transform="translate(8 16) scale(0.75)">
    <rect x="6"  y="8"  width="52" height="2" fill="#0E0E0C"/>
    <rect x="6"  y="54" width="52" height="2" fill="#0E0E0C"/>
    <rect x="18" y="14" width="16" height="3" fill="#0E0E0C"/>
    <rect x="22" y="14" width="8"  height="36" fill="#0E0E0C"/>
    <rect x="22" y="42" width="24" height="8"  fill="#0E0E0C"/>
    <rect x="42" y="38" width="3"  height="16" fill="#0E0E0C"/>
    <rect x="32" y="36" width="6"  height="6"  fill="#7C2233"/>
  </g>

  <!-- 24px gap, then wordmark glyphs translated to start at x=72. -->
  <g transform="translate(72 0)">
    <!-- L -->
    <rect x="12" y="12" width="22" height="4"  fill="#0E0E0C"/>
    <rect x="18" y="12" width="10" height="56" fill="#0E0E0C"/>
    <rect x="18" y="60" width="36" height="8"  fill="#0E0E0C"/>
    <rect x="50" y="54" width="4"  height="20" fill="#0E0E0C"/>
    <!-- o -->
    <path d="
      M 84 32
      a 18 18 0 1 0 0.001 0
      Z
      M 84 40
      a 10 10 0 1 1 -0.001 0
      Z" fill="#0E0E0C" fill-rule="evenodd"/>
    <!-- b -->
    <rect x="116" y="64" width="18" height="4"  fill="#0E0E0C"/>
    <rect x="120" y="10" width="10" height="58" fill="#0E0E0C"/>
    <path d="
      M 146 32
      a 18 18 0 1 0 0.001 0
      Z
      M 146 40
      a 10 10 0 1 1 -0.001 0
      Z" fill="#0E0E0C" fill-rule="evenodd"/>
    <rect x="128" y="34" width="6"  height="32" fill="#0E0E0C"/>
    <!-- i with oxblood square -->
    <rect x="186" y="32" width="10" height="36" fill="#0E0E0C"/>
    <rect x="186" y="14" width="10" height="10" fill="#7C2233"/>
    <!-- baseline rule -->
    <rect x="12"  y="74" width="184" height="1" fill="#0E0E0C"/>
  </g>
</svg>
