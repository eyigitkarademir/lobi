<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80" role="img" aria-label="Lobi wordmark, direction B">
  <!-- Wordmark "Lobi" — custom serif/sans hybrid.
       L: slab-serif (editorial)
       o: humanist sans bowl
       b: humanist sans with serif foot on stem
       i: square dot in oxblood
       Cap height = 56, baseline = 68, x-height ~ 40. -->

  <!-- L : slab-serif construction (matches mark) -->
  <rect x="12" y="12" width="22" height="4"  fill="#0E0E0C"/> <!-- top serif -->
  <rect x="18" y="12" width="10" height="56" fill="#0E0E0C"/> <!-- stem -->
  <rect x="18" y="60" width="36" height="8"  fill="#0E0E0C"/> <!-- foot -->
  <rect x="50" y="54" width="4"  height="20" fill="#0E0E0C"/> <!-- foot right serif -->

  <!-- o : pure humanist sans, vertical stress, contrast 0. Center (84, 50), outer r=18, inner r=10. -->
  <path d="
    M 84 32
    a 18 18 0 1 0 0.001 0
    Z
    M 84 40
    a 10 10 0 1 1 -0.001 0
    Z" fill="#0E0E0C" fill-rule="evenodd"/>

  <!-- b : ascender stem with editorial slab-foot, humanist bowl on right.
       Stem: x=120..130, y=10..68. Slab foot at bottom of stem (x=116..134).
       Bowl: center (146, 50), outer r=18, inner r=10. -->
  <rect x="116" y="64" width="18" height="4" fill="#0E0E0C"/> <!-- foot serif on stem (editorial mix) -->
  <rect x="120" y="10" width="10" height="58" fill="#0E0E0C"/> <!-- stem -->
  <path d="
    M 146 32
    a 18 18 0 1 0 0.001 0
    Z
    M 146 40
    a 10 10 0 1 1 -0.001 0
    Z" fill="#0E0E0C" fill-rule="evenodd"/>
  <!-- Bowl-stem connector: small 4px wide bridge so the b reads as one glyph -->
  <rect x="128" y="34" width="6" height="32" fill="#0E0E0C"/>

  <!-- i : straight stem + OXBLOOD square ink-block (the brand signature) -->
  <rect x="186" y="32" width="10" height="36" fill="#0E0E0C"/>
  <rect x="186" y="14" width="10" height="10" fill="#7C2233"/>

  <!-- Editorial baseline rule: 1px hairline under the wordmark, masthead style -->
  <rect x="12" y="74" width="184" height="1" fill="#0E0E0C"/>
</svg>
