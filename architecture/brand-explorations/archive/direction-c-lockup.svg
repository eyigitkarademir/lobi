<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Lobi lockup, direction C">
  <!-- Mark left at 48px, then 16px gap, then wordmark. -->

  <!-- Mark scaled 64->48, translated to (8, 8). -->
  <g transform="translate(8 8) scale(0.75)">
    <rect x="8"  y="8"  width="22" height="22" rx="5" fill="#1C1A22"/>
    <rect x="34" y="8"  width="22" height="22" rx="5" fill="#1C1A22"/>
    <rect x="8"  y="34" width="22" height="22" rx="5" fill="#1C1A22"/>
    <rect x="38" y="31" width="22" height="22" rx="5" fill="#9B7FB8"/>
  </g>

  <!-- Wordmark, translated to start at x=72 -->
  <g transform="translate(72 0)">
    <!-- L (solid construction) -->
    <rect x="6" y="14" width="8"  height="36" fill="#1C1A22"/>
    <rect x="6" y="42" width="30" height="8"  fill="#1C1A22"/>
    <!-- o -->
    <path d="
      M 60 22
      a 14 14 0 1 0 0.001 0
      Z
      M 60 28
      a 8 8 0 1 1 -0.001 0
      Z" fill="#1C1A22" fill-rule="evenodd"/>
    <!-- b -->
    <rect x="92" y="12" width="8" height="38" fill="#1C1A22"/>
    <path d="
      M 114 22
      a 14 14 0 1 0 0.001 0
      Z
      M 114 28
      a 8 8 0 1 1 -0.001 0
      Z" fill="#1C1A22" fill-rule="evenodd"/>
    <rect x="100" y="22" width="6" height="14" fill="#1C1A22"/>
    <!-- i with lilac circle dot -->
    <rect x="140" y="22" width="8" height="28" fill="#1C1A22"/>
    <circle cx="144" cy="14" r="4.5" fill="#9B7FB8"/>
  </g>
</svg>
