<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Lobi lockup, direction A">
  <!-- Mark on the left (scaled down to fit 48px), wordmark on the right. -->

  <!-- Mark, scaled & translated. Original 64x64 -> 48x48 starting at (8, 8). -->
  <g transform="translate(8 8) scale(0.75)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#FBF8F2"/>
    <path d="
      M 18 14
      L 28 14
      L 28 40
      L 50 40
      L 50 50
      L 28 50
      Q 18 50 18 40
      Z" fill="#B5532A"/>
    <circle cx="22.5" cy="44.5" r="1.6" fill="#FBF8F2"/>
  </g>

  <!-- 16px gap between mark and wordmark, then wordmark glyphs translated to start at x=72. -->
  <g transform="translate(72 0)">
    <!-- L -->
    <path d="
      M 6 14
      L 14 14
      L 14 42
      L 36 42
      L 36 50
      L 14 50
      Q 6 50 6 42
      Z" fill="#1F1A14"/>
    <!-- o -->
    <path d="
      M 60 22
      a 14 14 0 1 0 0.001 0
      Z
      M 60 28
      a 8 8 0 1 1 -0.001 0
      Z" fill="#1F1A14" fill-rule="evenodd"/>
    <!-- b -->
    <path d="
      M 92 12
      L 100 12
      L 100 22.6
      Q 105 22 110 22
      a 14 14 0 1 1 -10 23.8
      L 100 50
      L 92 50
      Z
      M 110 28
      a 8 8 0 1 0 0.001 0
      Z" fill="#1F1A14" fill-rule="evenodd"/>
    <!-- i with terracotta tittle -->
    <rect x="140" y="22" width="8" height="28" fill="#1F1A14"/>
    <rect x="140" y="10" width="8" height="8" rx="1.6" fill="#B5532A"/>
  </g>
</svg>
